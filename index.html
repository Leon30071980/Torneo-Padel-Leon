<style>

/* Torneo Beach Volley Leon · v2.5 · Nuova identità sportiva */
:root{
  color-scheme:dark;
  --bg:#031820;--card:#062c35;--card-strong:#073942;
  --ink:#f0fbfd;--mut:#9cc4cc;--line:#17616d;
  --a:#ffc956;--b:#0ad8dc;--a-muted:#453914;--b-muted:#09505a;
  --male:#80caff;--female:#ff9fc9;
  --f:'Exo 2',system-ui,sans-serif;
  box-sizing:border-box;
}
html{scroll-behavior:smooth;scroll-padding-top:150px}
*,*::before,*::after{box-sizing:border-box}
body{
  margin:0;min-height:100vh;overflow-x:hidden;
  background:radial-gradient(ellipse 700px 560px at 93% 18%,rgba(14,126,143,.41),transparent 77%),
    radial-gradient(ellipse 720px 530px at -4% 69%,rgba(9,90,107,.34),transparent 73%),
    linear-gradient(115deg,#031b24 0%,#043441 54%,#062731 100%);
  color:var(--ink);font:500 15px/1.55 var(--f);
  padding-bottom:env(safe-area-inset-bottom,0px)
}
body::after{content:'';position:fixed;inset:auto 0 0;height:15vh;pointer-events:none;z-index:0;
  background:linear-gradient(transparent,rgba(252,196,99,.055));}
.scene-art{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;opacity:.45}
.scene-art svg{width:100%;height:100%;object-fit:cover}
header,main,.login-overlay{position:relative;z-index:1}
h1,h2,h3{font-family:var(--f);letter-spacing:-.018em;margin:0;line-height:1.18}
h1{font-weight:900;font-size:clamp(20px,2.75vw,33px);letter-spacing:-.035em}
h2{font-size:22px;font-weight:800;margin:0 0 12px}
h3{font-size:17px;font-weight:800;margin:0 0 8px}
p{margin:8px 0 12px}
.site-header{position:sticky;top:0;z-index:12;background:rgba(3,22,30,.93);border-bottom:1px solid #127483;
  box-shadow:0 13px 32px #01151d50;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  padding:calc(10px + env(safe-area-inset-top,0px)) 18px 0}
.site-header::before{content:'';position:absolute;inset:0 0 auto;height:3px;background:linear-gradient(90deg,#055e68,transparent 40%,#0bbbc8 72%,transparent);pointer-events:none}
.in{max-width:1220px;margin:0 auto}
.masthead{display:flex;justify-content:space-between;align-items:center;gap:15px;padding:4px 0 11px}
.brand-lockup{display:flex;align-items:center;gap:14px;min-width:0}
.volley-logo{width:82px;height:82px;flex-shrink:0;display:block;filter:drop-shadow(0 4px 12px #02b7c140)}
.volley-logo img{width:100%;height:100%;display:block;object-fit:contain}
.brand-copy{min-width:0;padding-left:14px;border-left:2px solid #80bdc499}
.brand-accent{color:#14e5d9}
.app-version{font-size:12px;color:#a4cdd5;margin-top:2px;line-height:1.3;font-weight:500;font-style:italic}
.account-bar{display:flex;align-items:center;justify-content:flex-end;gap:14px;flex-wrap:wrap}
.pill{font-size:12px;color:#a9d9e2;font-weight:600}
#st{display:inline-flex;align-items:center;gap:7px}
#st::before{content:'';width:7px;height:7px;border-radius:50%;background:#20d7cf;box-shadow:0 0 9px #20d7cf}
nav{display:flex;gap:5px;overflow-x:auto;scrollbar-width:thin;margin:0 -3px;padding:0 3px 7px}
nav button{display:inline-flex;align-items:center;gap:9px;border:1px solid transparent;background:transparent;
  border-bottom:3px solid transparent;border-radius:9px 9px 0 0;
  font:700 14px var(--f);color:#b6d4d8;cursor:pointer;padding:11px 17px;
  white-space:nowrap;transition:color .18s,background .18s,border .18s}
nav button svg{width:17px;height:17px;flex-shrink:0;stroke-width:2.15}
nav button:hover{color:white;background:#0c4652}
nav button.on{color:#fff;background:linear-gradient(145deg,#0bd5d2,#087d8c);border-color:#32f6e6;
  box-shadow:inset 0 1px 0 #6cf9f3,0 6px 20px #04bbb92a}
main{max-width:1220px;margin:0 auto;padding:27px 18px 72px;min-height:70vh}
.card{background:linear-gradient(132deg,rgba(7,56,66,.97),rgba(3,36,46,.98));
  border:1px solid #137481;border-radius:16px;padding:21px 24px;margin:0 0 16px;
  box-shadow:0 15px 36px #00131c61,inset 0 1px 0 #61d9e018;overflow-x:auto}
.card h2{color:#f3fcfd}
.mut{color:var(--mut);font-size:13px;margin:5px 0 11px}
.section-heading{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.section-heading h2{margin:0;font-size:25px;font-style:italic;font-weight:900;text-transform:uppercase;letter-spacing:.015em}
.section-heading .section-label{background:#095965;border:1px solid #16b2c0;border-radius:999px;color:#a9fafa;padding:4px 11px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.07em}
.section-lead{font-size:14px;color:#c3e1e6;margin:0 0 19px}
.eyebrow{font-size:12px;letter-spacing:.11em;color:#3ae4df;font-weight:800;text-transform:uppercase}
.table-scroll{max-width:100%;overflow-x:auto;scrollbar-color:#258995 #062f38}
table{width:100%;border-collapse:separate;border-spacing:0;line-height:1.4}
th,td{padding:10px 11px;text-align:left;border-bottom:1px solid #155663;font-size:14px;vertical-align:middle}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#b5e1e8;background:#075462;font-weight:800;white-space:nowrap}
tr:first-child th:first-child{border-radius:8px 0 0 0}tr:first-child th:last-child{border-radius:0 8px 0 0}
td{color:#e6f8fa;background:rgba(1,40,49,.47)}
tr:nth-child(2n+1) td{background:rgba(11,66,75,.48)}
tr:hover td{background:rgba(13,101,108,.52)}
.n{text-align:right;font-variant-numeric:tabular-nums}
.lead td{font-weight:800}
.rank-table tr.rank-winner td{background:linear-gradient(90deg,#594c18c9,#383a1baf)!important;color:#fff4ce;
  border-top:1px solid #d2af43;border-bottom:1px solid #d2af43}
.rank-table tr.rank-winner td:first-child{border-left:2px solid #e5bc51;border-radius:8px 0 0 8px}
.rank-table tr.rank-winner td:last-child{border-right:2px solid #e5bc51;border-radius:0 8px 8px 0}
.rank-table tr.rank-spoon td{background:linear-gradient(90deg,#4d3024e6,#442a22aa)!important;color:#ffddc8;
  border-top:1px solid #d18d68;border-bottom:1px solid #d18d68}
.rank-table tr.rank-spoon td:first-child{border-left:2px solid #c48262;border-radius:8px 0 0 8px}
.rank-table tr.rank-spoon td:last-child{border-right:2px solid #c48262;border-radius:0 8px 8px 0}
.rank-symbol{font-size:19px;vertical-align:-2px;display:inline-block;margin-left:6px}
.rank-symbol svg{vertical-align:-3px;width:19px!important;height:19px!important}
.rank-pos{display:inline-grid;place-items:center;min-width:26px;min-height:25px;padding:2px 5px;border-radius:6px;font-weight:900;color:#dbf9fa;background:#165865}
.rank-winner .rank-pos{background:linear-gradient(135deg,#ffe381,#eaa71d);color:#4d3000}
.rank-spoon .rank-pos{background:linear-gradient(135deg,#e2b28b,#9f5d37);color:#36170e}
input,select{font:600 14px var(--f);color:#f5fdff;background:#022b34;border:1px solid #2a7280;border-radius:9px;
  padding:9px 10px;width:100%;min-width:85px;outline-offset:2px}
input:focus,select:focus{outline:2px solid #40e7e2;border-color:#43e6e5}
input::placeholder{color:#8aaeb7;opacity:1}
input:disabled,select:disabled{opacity:.67;cursor:not-allowed}
select{min-width:65px;cursor:pointer}
input[type=number]{width:69px;min-width:0;text-align:center;font-variant-numeric:tabular-nums}
.sc input[type=number]{-moz-appearance:textfield;appearance:textfield}
.sc input[type=number]::-webkit-inner-spin-button,.sc input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
input[type=checkbox]{accent-color:#18d1d3;cursor:pointer}
.p,.s{border-radius:10px;font:800 14px var(--f);cursor:pointer;padding:11px 19px;min-height:41px;
  transition:transform .14s,background .14s,box-shadow .14s;white-space:normal}
.p{background:linear-gradient(135deg,#13e4d5,#078ba0);color:#06232a;border:1px solid #2ce8e2;
  box-shadow:inset 0 1px 0 #90ffff8f,0 7px 16px #03b7ba25}
.s{background:#07313b;border:1px solid #237d89;color:#d9f5f8}
.p:not(:disabled):hover,.s:not(:disabled):hover{transform:translateY(-1px);box-shadow:0 7px 17px #00192070}
.s:not(:disabled):hover{background:#09505e}
.p:disabled,.s:disabled{opacity:.44;cursor:not-allowed;box-shadow:none}
.row{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0;align-items:center}
.bd{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:7px;font:800 12px var(--f);
  color:#322007;margin-right:7px;vertical-align:1px;font-style:normal}
.bd.A{background:linear-gradient(140deg,#ffdf86,#f3a72a)}
.bd.B{background:linear-gradient(140deg,#25d9e0,#077c99);color:#fff}
.sexname.M{color:var(--male);font-weight:800}.sexname.F{color:var(--female);font-weight:800}
.sortbtn{background:none;border:0;padding:0;color:inherit;font:inherit;font-weight:inherit;cursor:pointer;white-space:nowrap;text-transform:inherit;letter-spacing:inherit}
.sortbtn::after{content:' ↕';font-size:11px;opacity:.57}.sortbtn.up::after{content:' ↑';opacity:1}.sortbtn.down::after{content:' ↓';opacity:1}
.m{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:12px;align-items:center}
.t{display:flex;flex-direction:column;gap:7px;font-size:15px;font-weight:700}
.t>span{line-height:1.4}
.sc{display:flex;gap:9px;align-items:center;justify-content:center;white-space:nowrap;font-size:23px;font-weight:900;color:#a6faff;font-variant-numeric:tabular-nums}
.sc input{width:66px;height:47px;font-size:20px;font-weight:900;border-color:#3693a0;background:#06303a}
.seg{display:flex;gap:5px}.seg button{width:42px;height:36px;border:1px solid var(--line);background:#073843;border-radius:8px;color:var(--ink);font:800 14px var(--f);cursor:pointer}
.seg .A.on{background:var(--a);border-color:var(--a);color:#0b2a33}.seg .B.on{background:var(--b);border-color:var(--b);color:#002934}
.updateplus{color:#71eee1;font-weight:900;white-space:nowrap}.updateneg{color:#ffadca;font-weight:900;white-space:nowrap}
.previewbox{border:1px solid #238d99;border-radius:12px;padding:10px;margin-top:14px;overflow-x:auto;background:#062932}
.public{display:inline-flex;align-items:center;gap:7px}
.x{background:none;border:0;color:#bbd5da;cursor:pointer;font-size:18px}
.user-hidden{display:none!important}
/* Classifica finale: premi, podio, tabellone */
.final-heading{position:relative;text-align:center;padding:13px 10px 22px}
.final-heading .finished-badge{display:inline-flex;align-items:center;gap:8px;border:1px solid #20c7d6;
  border-radius:9px;padding:5px 19px;color:#9ffff7;background:linear-gradient(160deg,#0b6976,#07505f);
  box-shadow:0 0 12px #08abb120;font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.final-heading h2{font-size:clamp(26px,3.9vw,41px);font-style:italic;font-weight:900;text-transform:uppercase;
  letter-spacing:.02em;margin:10px 0 0;text-shadow:0 4px 13px #001c23}
.award-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin:0 0 19px}
.award-card{display:flex;align-items:center;gap:18px;min-height:135px;border-radius:15px;overflow:hidden;
  padding:20px 23px;position:relative;box-shadow:0 12px 29px #00161e80}
.award-card::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(125deg,transparent 0,transparent 25px,#ffffff09 26px,transparent 27px)}
.award-card.champion{border:2px solid #e6b837;background:radial-gradient(circle at 15% 50%,#9c741e7a,transparent 42%),linear-gradient(115deg,#433919,#242f25 69%,#89691550)}
.award-card.spoon{border:2px solid #b77c61;background:radial-gradient(circle at 18% 50%,#a36e485c,transparent 46%),linear-gradient(115deg,#442d23,#2a2424 70%,#8e543d55)}
.award-icon{flex:0 0 78px;display:grid;place-items:center;filter:drop-shadow(0 5px 11px #050a0d99)}
.award-icon svg{width:75px;height:75px;display:block}
.award-info{position:relative;z-index:1;min-width:0}
.award-label{font-size:clamp(12px,1.6vw,18px);font-weight:900;letter-spacing:.055em;text-transform:uppercase;line-height:1.25}
.champion .award-label{color:#ffdc78}.spoon .award-label{color:#f0bf9b}
.award-name{font-size:clamp(18px,2.2vw,29px);font-weight:900;font-style:italic;line-height:1.17;margin-top:7px;
  letter-spacing:-.02em;overflow-wrap:anywhere;color:#fff}
.final-board{padding:20px 20px 24px;border-color:#0fb0b9}
.board-header{display:flex;align-items:center;justify-content:space-between;gap:9px;flex-wrap:wrap;margin:0 0 15px}
.board-header h2{font-style:italic;font-weight:900;margin:0;text-transform:uppercase}
.stats-pill{border:1px solid #0a9caa;border-radius:999px;background:#064b57;color:#80f5ef;padding:5px 12px;font-size:11px;font-weight:800}
.rank-table{min-width:500px}
.rank-table th{background:#07505d}
.rank-table td{padding:10px 12px}
.rank-table .player-col{min-width:190px}
.rank-points{font-weight:900;font-size:18px;color:#f6ce6c}
.progress-summary{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;
  color:#b5dae1;font-size:13px;font-weight:700;margin:0 0 14px}
.progress-track{height:7px;border-radius:99px;background:#0a4651;overflow:hidden;border:1px solid #246c75;margin-bottom:15px}
.progress-track .progress-fill{height:100%;background:linear-gradient(90deg,#05a8b2,#24e7d8);border-radius:99px}
/* Selezione e gruppi */
.groups-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
.group-panel{border:1px solid #257b84;border-radius:12px;background:#082e38;padding:15px;min-width:0}
.group-panel .group-title{display:flex;align-items:center;font-size:16px;margin-bottom:12px;font-weight:900}
.group-panel table{font-size:13px}
.group-panel td,.group-panel th{padding:8px 7px}
.group-panel table{min-width:320px}
.group-table-wrap{overflow-x:auto;max-width:100%}
.groups-ready{border-color:#11b9bc;background:linear-gradient(135deg,#073e47,#062b36)}
.groups-ready .group-actions{padding-top:6px;margin-bottom:0}
.groups-ready .group-actions .p{font-size:15px;padding:13px 24px}
.select-progress{height:8px;max-width:460px;border:1px solid #337983;border-radius:30px;overflow:hidden;background:#07343e;margin:10px 0 15px}
.select-progress>span{display:block;height:100%;background:linear-gradient(90deg,#09a9b8,#11e1d2);border-radius:30px}
.mode-buttons .p,.mode-buttons .s{flex:0 1 auto}
/* Scorecard dei turni */
.round-header{margin:28px 0 12px!important;font-size:23px;font-style:italic;font-weight:900;text-transform:uppercase;color:#e9fbff}
.round-header::before{content:'◆';color:#07cbd3;margin-right:11px;font-size:13px;vertical-align:3px}
.match-card{border-color:#177482;background:linear-gradient(135deg,rgba(7,61,70,.96),rgba(3,35,44,.96));padding:18px 24px}
.match-label{display:flex;align-items:center;gap:8px;text-transform:uppercase;font-size:11px;letter-spacing:.07em;font-weight:800;color:#74e9e4;margin:0 0 14px}
.match-label::before{content:'';display:block;width:6px;height:6px;background:#00d7d8;border-radius:50%;box-shadow:0 0 7px #00d7d8}
.match-card .t{font-size:16px;gap:9px}
.match-card .mut:last-child{margin-top:13px;margin-bottom:0}
.match-card .tie-msg{color:#ffbea2}
/* Classifica generale e storico */
.general-table{min-width:870px}
.general-table input{font-size:13px;padding:8px 8px}
.general-table input[type=number]{width:74px}
.general-table input.sexname{font-weight:800}
.general-table th{padding:10px 8px}
.general-table td{padding:7px 5px}
.history-entry{background:linear-gradient(135deg,#073c46,#062934);border:1px solid #217b85;border-radius:14px;
  margin:0 0 16px;overflow:hidden;box-shadow:0 10px 25px #001a2069}
.history-entry>summary{padding:18px 21px;cursor:pointer;list-style-position:inside;font-size:16px;line-height:1.55}
.history-entry>summary::marker{color:#3de8db}
.history-entry>summary:hover{background:#0a505a}
.history-entry[open]>summary{border-bottom:1px solid #176877}
.history-inner{padding:19px}
.history-inner .card{margin-top:10px}
.history-inner .sc{white-space:nowrap;font-variant-numeric:tabular-nums}
.history-entry summary .mut{display:inline}
.history-entry summary .history-small{display:block;margin:5px 0 0}
.history-inner .award-grid{margin-top:12px}
.history-inner .award-card{min-height:110px}
.history-inner .award-name{font-size:19px}
/* v2.3 · Classifica Generale · Proposta B: righe sportive colorate per sesso.
   Solo .general-table: Turni, Storico, Gruppi e classifica live restano invariati. */
.general-table{border-collapse:separate;border-spacing:0 4px}
.general-table th{border-bottom:1px solid #1dbec3}
.general-table tr.general-row td{
  background:#0d4c6d;
  color:#f3fcff;
  border-top:1px solid #2b94b9;
  border-bottom:1px solid #1a7190;
  transition:background-color .15s,filter .15s;
}
.general-table tr.general-row--m td{background:#114866;border-top-color:#2c87b2;border-bottom-color:#1e6386}
.general-table tr.general-row--f td{background:#783957;border-top-color:#bd6089;border-bottom-color:#853c60}
.general-table tr.general-row--m:hover td{background:#195b7e}
.general-table tr.general-row--f:hover td{background:#925071}
.general-table tr.general-row td:first-child{
  padding-left:11px;border-left:5px solid #46c9ff;
  border-radius:9px 0 0 9px;
}
.general-table tr.general-row--f td:first-child{border-left-color:#ff80b4}
.general-table tr.general-row td:last-child{border-radius:0 9px 9px 0;border-right:1px solid #2a7d9d}
.general-table tr.general-row--f td:last-child{border-right-color:#ab5e81}
.general-table .general-position{
  display:inline-flex;align-items:center;justify-content:center;
  min-width:32px;min-height:29px;
  color:#fff;font-size:15px;font-weight:900;font-variant-numeric:tabular-nums;
  background:linear-gradient(145deg,#15789d,#063e59);
  border:1px solid #53bfdb;
  clip-path:polygon(17% 0,100% 0,83% 100%,0 100%);
  box-shadow:none;
}
.general-table tr.general-row--f .general-position{background:linear-gradient(145deg,#b64d84,#682645);border-color:#ff9ac5}
.general-table tr.general-row .general-position--first{background:linear-gradient(145deg,#ffe58f,#e5a200);color:#492b00;border-color:#ffe399}
.general-table tr.general-row .general-position--second{background:linear-gradient(145deg,#f4f8fb,#9cbbc5);color:#2d4550;border-color:#f4fcff}
.general-table tr.general-row .general-position--third{background:linear-gradient(145deg,#ffc996,#c7763b);color:#482508;border-color:#f5bd82}
.general-table .general-sex{min-width:62px}
.general-table .general-average{white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums}
.general-table .general-average strong{
  display:inline-block;min-width:61px;text-align:center;border-radius:999px;
  padding:5px 9px;background:linear-gradient(180deg,#32eaf0,#009aad);
  color:#002f39;font-size:14px;font-weight:900;
}
.general-table tr.general-row--f .general-average strong{background:linear-gradient(180deg,#ffc1df,#ef6cae);color:#482038}
.general-table tr.general-row input,.general-table tr.general-row select{
  color:#fff;background:rgba(0,15,28,.22);border-color:rgba(255,255,255,.26);
  border-radius:7px;min-width:0;
}
.general-table tr.general-row input.sexname{color:#fff}
.general-table tr.general-row--f input,.general-table tr.general-row--f select{background:rgba(49,8,31,.27);border-color:rgba(255,194,225,.38)}
.general-table tr.general-row input:focus,.general-table tr.general-row select:focus{
  outline:2px solid #5ef7e6;outline-offset:1px;border-color:#5ef7e6;
}
.general-table tr.general-row input:disabled,.general-table tr.general-row select:disabled{
  opacity:1;background:transparent;border-color:transparent;color:#fff;
  -webkit-text-fill-color:#fff;
}
.general-table tr.general-row .x{color:#fff;opacity:.8}
.general-table tr.general-row .x:hover{opacity:1;color:#fff}
@media(max-width:670px){
  .general-table{border-spacing:0 3px}
  .general-table tr.general-row td:first-child{padding-left:7px}
  .general-table .general-position{min-width:27px;min-height:27px}
  .general-table .general-average strong{min-width:56px}
}
/* v2.5 · Gruppi / Seleziona i partecipanti · Proposta B coerente con la classifica generale. */
.participants-table{min-width:630px}
.participants-table th:first-child,.participants-table td.participant-choice{text-align:center;width:66px}
.participants-table tr.participants-row td{font-weight:650}
.participants-table tr.participants-row td:nth-child(2),
.participants-table tr.participants-row td:nth-child(3){font-weight:800}
.participants-table tr.participants-row .sexname{color:#fff}
.participants-table .participant-choice{padding:5px 11px;vertical-align:middle}
.participants-table .participant-check{
  appearance:none;-webkit-appearance:none;display:inline-grid;place-items:center;
  width:25px;height:25px;min-width:25px;min-height:25px;
  padding:0;margin:0;cursor:pointer;border-radius:7px;
  border:2px solid #79cfe9;background:#0a3045;
  box-shadow:inset 0 1px 3px #00192388;
  vertical-align:middle;transition:background-color .14s,border-color .14s,transform .14s;
}
.participants-table .participant-check::after{content:'✓';font-size:17px;font-weight:1000;line-height:1;opacity:0;transform:scale(.6);transition:transform .13s,opacity .13s;color:#06333a}
.participants-table .participant-check:checked{background:#6ce9f1;border-color:#c4feff;box-shadow:0 0 0 2px #4bcee54a}
.participants-table .participant-check:checked::after{opacity:1;transform:scale(1)}
.participants-table .general-row--f .participant-check{border-color:#ffb3d5;background:#54203d}
.participants-table .general-row--f .participant-check:checked{background:#ffadd4;border-color:#ffe0ee;box-shadow:0 0 0 2px #ff8aba55}
.participants-table .participant-check:focus-visible{outline:3px solid #fff;outline-offset:2px}
.participants-table .participant-check:disabled{opacity:.45;cursor:not-allowed}
.participants-table tr.participants-selected td{border-top-color:#66eaf1;border-bottom-color:#66eaf1}
.participants-table tr.participants-selected.general-row--f td{border-top-color:#ffacd6;border-bottom-color:#ffacd6}
.participants-table .participant-sex-label{
  display:inline-flex;min-width:36px;justify-content:center;align-items:center;
  border:1px solid #59c5e5;border-radius:999px;padding:4px 9px;
  font-size:13px;font-weight:900;line-height:1.1;color:#fff;background:#07638a
}
.participants-table .general-row--f .participant-sex-label{border-color:#f8add3;background:#ac3b78}
.participants-table .general-average strong{min-width:66px}
.participants-table .participant-choice input:disabled{background:#092b41;border-color:#5a9ab2;-webkit-text-fill-color:initial}
.participants-table .general-row--f .participant-choice input:disabled{background:#54203d;border-color:#c578a3}
@media(max-width:670px){
  .participants-table{min-width:540px}
  .participants-table th:first-child,.participants-table td.participant-choice{width:54px}
  .participants-table .participant-choice{padding:5px 7px}
}

  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}

.login-card h2{font-size:23px;font-weight:900;font-style:italic}
.login-card label{display:block;font-weight:800;color:#caeaf0;margin:13px 0 6px}
.login-card input{min-width:0;padding:12px}
.login-card .row button{flex:1}
:focus-visible{outline:2px solid #50fff1;outline-offset:3px}

  .site-header{padding:calc(8px + env(safe-area-inset-top,0px)) 12px 0}

  .app-version{font-size:10px}
  .account-bar{flex-direction:column;gap:4px;align-items:flex-end}
  #st{font-size:10px;max-width:125px;text-align:right}

  nav{gap:2px;padding-bottom:4px}nav button{font-size:12px;padding:9px 10px;gap:5px}nav button svg{width:15px;height:15px}
  main{padding:17px 10px 60px}

<script>
const SUPABASE_URL='https://aelwovphlzesshsvflst.supabase.co',SUPABASE_KEY='sb_publishable_OwMYzJuBbxb0-WX8ub25_g_TKyaU5Sq';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
// Ricorda solamente la scheda, in questo browser. Nessun dato del torneo viene salvato localmente.
const LAST_TAB_KEY='torneo_padel_leon:last_tab';
const VALID_TABS=new Set(['live','turni','gruppi','generale','storico','aggiorna']);
function loadLastTab(){
  try{const t=localStorage.getItem(LAST_TAB_KEY);return VALID_TABS.has(t)?t:'live';}
  catch(e){return 'live';} // Funziona anche quando lo storage è bloccato.
}
function rememberTab(t){
  if(!VALID_TABS.has(t))return;
  try{localStorage.setItem(LAST_TAB_KEY,t)}catch(e){}
}
let S={players:[],sel:{},T:null,mode:4},tab=loadLastTab(),ROLE='NONE',ADMIN=false,AUTH=null,timer,q=Promise.resolve(),HISTORY=[],HISTORY_ERROR='';
let approving=false;
let sorts={generale:{key:'med',dir:-1},gruppi:{key:'med',dir:-1}};
const norm=d=>{d=d&&typeof d=='object'?d:{};const players=(d.players||[]).map(p=>{const oldG=Number.isFinite(+p.g)?+p.g:0;const t=Number.isFinite(+p.t)?+p.t:Math.floor(oldG/5);return{...p,t,vinti:Math.max(0,Number(p.vinti)||0),ultimo:Math.max(0,Number(p.ultimo)||0)}});return{players,sel:d.sel||{},T:d.T||null,mode:[4,6,8].includes(Number(d.mode||d.T?.mode))?Number(d.mode||d.T?.mode):4}};
function setSt(t,err){const e=document.getElementById('st');if(e){e.textContent=t;e.style.color=err?'#c0392b':''}}
function save(){if(ROLE!=='ADMIN'&&ROLE!=='USER')return;clearTimeout(timer);setSt('Salvataggio…');timer=setTimeout(()=>{const snap=JSON.parse(JSON.stringify(S));
q=q.then(()=>sb.rpc('salva_stato_auth',{p_data:snap})).then(({error})=>setSt(error?'Errore di salvataggio: '+error.message:'Salvato',!!error)).catch(()=>setSt('Errore di rete',true))},350)}
async function fetchState(){const{data,error}=await sb.from('torneo_stato').select('data').eq('id',1).single();if(error){setSt('Errore di lettura: '+error.message,true);return false}S=norm(data.data);return true}
async function fetchHistory(){
  const {data,error}=await sb.from('torneo_storico').select('id,approved_at,mode,snapshot').order('approved_at',{ascending:false}).limit(500);
  HISTORY_ERROR=error?error.message:'';
  if(!error)HISTORY=data||[];
  if(tab==='storico')R();
  return !error;
}
async function login(){
  if(AUTH){
    setSt('Uscita…');
    const {error}=await sb.auth.signOut();
    if(error){setSt('Errore di uscita: '+error.message,true);return}
    AUTH=null;ROLE='NONE';ADMIN=false;
    setSt('Accesso richiesto');
    if(tab==='aggiorna'){tab='live';rememberTab(tab)}
    R();
    return;
  }
  openLogin();
}
function openLogin(){
  const o=document.getElementById('loginOverlay');
  o.classList.add('open');
  setTimeout(()=>document.getElementById('loginEmail')?.focus(),50);
}
function closeLogin(){
  document.getElementById('loginOverlay').classList.remove('open');
}
async function submitLogin(event){
  event.preventDefault();
  const email=document.getElementById('loginEmail').value.trim();
  const password=document.getElementById('loginPassword').value;
  const button=document.getElementById('loginSubmit');
  if(!email||!password)return;
  button.disabled=true;button.textContent='Accesso…';setSt('Accesso…');
  const{data,error}=await sb.auth.signInWithPassword({email,password});
  button.disabled=false;button.textContent='Accedi';
  if(error){setSt('Accesso negato',true);alert('Email o password non corretti.');document.getElementById('loginPassword').select();return}
  closeLogin();
  document.getElementById('loginPassword').value='';
  await setAuth(data.user);
}
async function setAuth(user){
  AUTH=user||null;
  if(!user){ROLE='NONE';ADMIN=false;setSt('Accesso richiesto');if(tab==='aggiorna'){tab='live';rememberTab(tab)}R();return}
  const{data,error}=await sb.rpc('get_my_role');
  if(error||!data){await sb.auth.signOut();AUTH=null;ROLE='NONE';ADMIN=false;setSt('Ruolo non configurato',true);alert('Utente autenticato ma ruolo non configurato in Supabase.');R();return}
  ROLE=String(data).toUpperCase();ADMIN=ROLE==='ADMIN';
  if(ROLE!=='ADMIN'&&ROLE!=='USER'){await sb.auth.signOut();AUTH=null;ROLE='NONE';ADMIN=false;setSt('Ruolo non valido',true);R();return}
  await fetchState();
  void fetchHistory();
  // Non cambiare la pagina aperta al login o al ritorno nell'app.
  // L'area di approvazione è accessibile solo se ancora pertinente.
  if(tab==='aggiorna' && !(ADMIN && S.T && !S.T.applied && isComplete(S.T))){tab='live';rememberTab(tab)}
  R();
}
async function init(){
  R();
  const{data}=await sb.auth.getSession();
  await setAuth(data.session?.user||null);
  if(!data.session?.user)void fetchHistory();
  // Non attendere chiamate Supabase nel callback Auth: può bloccare signOut().
  sb.auth.onAuthStateChange((_event,session)=>{
    setTimeout(()=>{void setAuth(session?.user||null)},0);

// Modalità 4 e 6: calendario all'avvio. Modalità 8: turni generati dai risultati.
// La ricerca privilegia partner diversi e avversari variati.
function makeSchedule(A,B,mode){
  const ids=[...A,...B],games=[];
  if(mode===4){
    const [a,b,c,d]=ids;
    const blocks=[[[a,b],[c,d]],[[a,c],[b,d]],[[a,d],[b,c]]];
    for(let i=0;i<6;i++){
      const t=blocks[i%3];games.push({A:ids,matches:[{t1:[...t[0]],t2:[...t[1]],s1:'',s2:''}]});
    }
    return games;
  }
  if(mode===8){
    // Come Beach Volley: si genera soltanto il primo turno.
    // I turni successivi dipendono dai risultati appena inseriti.
    return [makeRoundAB(A,B,[])];
  }
  // 6 giocatori: 6 partite e 3 riposi esatti a testa, mai riposi consecutivi.
  // Nove coppie di riposo distinte, ciascuna posizione riposa esattamente tre volte.
  const restPattern=[[0,1],[2,3],[4,5],[0,2],[1,3],[0,4],[1,5],[2,4],[3,5]];
  const sex=Object.fromEntries(S.players.map(p=>[String(p.id),p.s==='F'?'F':'M']));
  let best=null,bestScore=Infinity;
  for(let trial=0;trial<1800;trial++){
    const shuffled=sh(ids);
    const mates={},opps={},rounds=[];
    let penalty=0;
    for(const restIdx of restPattern){
      const resting=restIdx.map(i=>shuffled[i]);
      const active=shuffled.filter(id=>!resting.includes(id));
      const variants=[[[0,1],[2,3]],[[0,2],[1,3]],[[0,3],[1,2]]];
      let bestVariant=null,local=Infinity;
      for(const v of variants){
        const team1=v[0].map(i=>active[i]),team2=v[1].map(i=>active[i]);
        let sc=0;
        // FF contro MM ha una penalità proibitiva: se vi sono 2F e 2M,
        // vengono scelte coppie miste anziché due coppie omogenee contrapposte.
        const gender1=team1.map(id=>sex[String(id)]).sort().join('');
        const gender2=team2.map(id=>sex[String(id)]).sort().join('');
        // Priorità alle coppie miste F+M: la presenza di F+F è
        // fortemente penalizzata rispetto alla rotazione dei compagni.
        // Se F+F è inevitabile (es. tre donne in campo), è comunque ammessa.
        if(gender1==='FF')sc+=1000;
        if(gender2==='FF')sc+=1000;
        if((gender1==='FF'&&gender2==='MM')||(gender1==='MM'&&gender2==='FF'))sc+=10000;
        for(const pair of [team1,team2]){
          const n=mates[key(pair)]||0;
          sc+=n*30+n*n*12;
        }
        for(const x of team1)for(const y of team2){
          const n=opps[key([x,y])]||0;
          sc+=n*3;
        }
        sc+=Math.random()*0.01;
        if(sc<local){local=sc;bestVariant=v;}
      }
      penalty+=local;
      const t1=bestVariant[0].map(i=>active[i]);
      const t2=bestVariant[1].map(i=>active[i]);
      for(const team of [t1,t2]){
        const k=key(team);mates[k]=(mates[k]||0)+1;
      }
      for(const x of t1)for(const y of t2){
        const k=key([x,y]);opps[k]=(opps[k]||0)+1;
      }
      rounds.push({A:ids,matches:[{t1,t2,s1:'',s2:''}],rest:resting});
    }
    if(penalty<bestScore){bestScore=penalty;best=rounds;}
  }
  return best;
}
// Genera coppie AB contro AB. Prima evita partner gia' incontrati;
// quando non e' possibile, minimizza le ripetizioni e gli avversari ricorrenti.
function makeRoundAB(A,B,previousRounds){
  if(A.length!==4||B.length!==4||new Set([...A,...B]).size!==8){
    throw Error('Per ogni turno servono 4 giocatori A e 4 B distinti.');
  }
  const partnerCount={},opponentCount={};
  for(const r of previousRounds){
    for(const m of r.matches){
      for(const tm of [m.t1,m.t2]){
        const k=key(tm);partnerCount[k]=(partnerCount[k]||0)+1;
      }
      for(const x of m.t1)for(const y of m.t2){
        const k=key([x,y]);opponentCount[k]=(opponentCount[k]||0)+1;
      }
    }
  }
  const sexes=Object.fromEntries(S.players.map(p=>[p.id,p.s||'M']));
  let best=null,bestScore=Infinity;
  // 24 permutazioni dei partner B, tre accoppiamenti fra quattro coppie.
  const perms=a=>a.length? a.flatMap((v,i)=>perms(a.filter((_,j)=>j!==i)).map(q=>[v,...q])):[[]];
  const layouts=[[[0,1],[2,3]],[[0,2],[1,3]],[[0,3],[1,2]]];
  for(const shuffledA of [A, [...A].reverse()]){
    for(const bs of perms(B)){
      const pairs=shuffledA.map((id,i)=>[id,bs[i]]);
      for(const layout of layouts){
        let score=0;
        for(const pair of pairs){
          const n=partnerCount[key(pair)]||0;
          score+=n*100+n*n*20;
        }
        for(const [i,j] of layout){
          const x=pairs[i],y=pairs[j];
          for(const a of x)for(const b of y){
            const n=opponentCount[key([a,b])]||0;
            score+=n*5;
          }
          const men=t=>t.filter(id=>sexes[id]==='M').length;
          const mx=men(x),my=men(y);
          if((mx===0&&my!==0)||(my===0&&mx!==0))score+=30;
          if((mx===0&&my===2)||(mx===2&&my===0))score+=30;
        }
        // Scelta casuale in caso di parita': mantiene una certa varieta'.
        score+=Math.random()*0.01;
        if(score<bestScore){bestScore=score;best=layout.map(([i,j])=>({t1:pairs[i],t2:pairs[j],s1:'',s2:''}));}
      }
    }
  }
  return {A:[...A],matches:best};
}
function legacyEight(T){return T?.mode===8 && T.scheduleVersion!==2;}
function roundReady(r){
  return r.matches.every(done);
}
// In caso di pareggio il sorteggio assegna una squadra al gruppo A
// e l'altra al gruppo B esclusivamente ai fini del turno successivo.
// Il risultato resta un pareggio e assegna 1 punto a ogni giocatore.
function nextRound(){
  const T=S.T;
  if(!AUTH||!T||T.mode!==8||legacyEight(T)||T.rounds.length>=6)return;
  const last=T.rounds[T.rounds.length-1];
  if(!roundReady(last)){alert('Inserisca entrambi i risultati prima di generare il turno successivo.');return;}
  const A=[],B=[];
  last.matches.forEach(m=>{
    if(+m.s1===+m.s2 && m.advance!==1 && m.advance!==2){
      m.advance=Math.random()<0.5?1:2;
    }
    const first=+m.s1>+m.s2 || (+m.s1===+m.s2 && m.advance===1);
    A.push(...(first?m.t1:m.t2));B.push(...(first?m.t2:m.t1));
  });
  try{
    T.rounds.push(makeRoundAB(A,B,T.rounds));
    T.review=null;save();R();
  }catch(e){setSt('Errore generazione turno: '+e.message,true);}
}
function table(){const T=S.T,t={};Object.keys(T.names).forEach(id=>t[id]={id,pt:0,g:0,w:0,d:0,l:0,pf:0,ps:0});
T.rounds.forEach(r=>r.matches.forEach(m=>{if(!done(m))return;const a=+m.s1,b=+m.s2;[[m.t1,a,b],[m.t2,b,a]].forEach(([tm,f,s])=>tm.forEach(id=>{const x=t[id];x.g++;x.pf+=f;x.ps+=s;if(f>s){x.pt+=3;x.w++}else if(f===s){x.pt++;x.d++}else x.l++}))}));
return Object.values(t).sort((a,b)=>b.pt-a.pt||(b.pf-b.ps)-(a.pf-a.ps)||b.pf-a.pf||String(T.names[a.id]||'').localeCompare(String(T.names[b.id]||''),'it'))}

function sortBy(view,key){

}
function cmpVal(a,b,key){
  let x,y;
  if(key==='med'){x=med(a);y=med(b)}

  else if(key==='tot'){x=a.tot||0;y=b.tot||0}
  else if(key==='n'||key==='c'||key==='s'){x=(a[key]||'').toLocaleLowerCase('it');y=(b[key]||'').toLocaleLowerCase('it')}
  else{x=a[key]??0;y=b[key]??0}
  if(typeof x==='string')return x.localeCompare(y,'it',{sensitivity:'base'})
  return x-y;
}
function sortedPlayers(view){
  const o=sorts[view]||{key:'med',dir:-1};

function th(view,label,key,cls=''){

}

  const col=(L,ids)=>`<div class="group-box ${L}"><div class="group-head"><i class="bd ${L}">${L}</i>Gruppo ${L}</div><table><tr><th>Nome</th><th>Cognome</th><th class="n">Tornei</th><th class="n">Media</th></tr>${ids.map(id=>{const p=S.players.find(x=>x.id==id);return `<tr><td><span class="sexname ${p.s=='F'?'F':'M'}">${esc(p.n)}</span></td><td><span class="sexname ${p.s=='F'?'F':'M'}">${esc(p.c)}</span></td><td class="n">${p.t||0}</td><td class="n">${med(p).toFixed(2)}</td></tr>`}).join('')}</table></div>`;
  return `${ok?`<div class="card" id="riepilogo-gruppi"><h2 style="margin-top:0">Riepilogo gruppi · ${C.players} giocatori</h2><div class="group-duo">${col('A',g.A)}${col('B',g.B)}</div><div class="row"><button class="p" onclick="start()">Avvia torneo</button></div></div>`:''}<div class="card"><h2>Modalità torneo</h2><div class="row"><button class="${C.mode===4?'p':'s'}" onclick="setMode(4)">1 campo · 4 giocatori</button><button class="${C.mode===6?'p':'s'}" onclick="setMode(6)">1 campo · 6 giocatori</button><button class="${C.mode===8?'p':'s'}" onclick="setMode(8)">2 campi · 8 giocatori</button>${S.T?'<button class="s" onclick="resetTournament()">Azzera torneo</button>':''}</div><p class="mut">Ogni partecipante giocherà 6 partite. ${C.mode===8?'Squadre sempre AB contro AB.':C.mode===6?'Due giocatori a riposo per turno, mai consecutivamente. Preferenza alle coppie F+M; evitiamo FF contro MM.':'Ogni coppia di compagni si ripete due volte.'}</p></div>
  <div class="card"><p>Selezioni ${C.players} giocatori dalla Classifica Generale. ${C.mode===8?'Al primo turno i 4 giocatori con media più alta formeranno il gruppo A e gli altri 4 il gruppo B. Dopo ogni turno chi vince passa nel gruppo A e chi perde nel gruppo B.':'I gruppi A e B sono indicativi e servono per visualizzare i partecipanti.'}</p><p><b>${n}/${C.players} selezionati</b></p><div class="row"><button class="s" onclick="selTop()">Seleziona i primi ${C.players}</button><button class="s" onclick="S.sel={};save();R()">Azzera selezione</button></div>${P.length<C.players?`<p class="mut">Servono almeno ${C.players} giocatori nella Classifica Generale.</p>`:''}<table><tr><th></th>${th('gruppi','Nome','n')}${th('gruppi','Cognome','c')}${th('gruppi','Sesso','s')}${th('gruppi','Tornei','t','n')}${th('gruppi','Media','med','n')}</tr>${P.map(p=>`<tr><td><input type="checkbox" style="width:22px;height:22px;min-width:0" aria-label="Seleziona ${esc(p.n)} ${esc(p.c)}" ${S.sel[p.id]?'checked':''} ${!S.sel[p.id]&&n>=C.players?'disabled':''} onchange="tg('${p.id}')"></td><td><span class="sexname ${p.s=='F'?'F':'M'}">${esc(p.n)}</span></td><td><span class="sexname ${p.s=='F'?'F':'M'}">${esc(p.c)}</span></td><td>${p.s||'M'}</td><td class="n">${p.t||0}</td><td class="n">${med(p).toFixed(2)}</td></tr>`).join('')}</table></div>
  `;
}
function generale(){
  const P=sortedPlayers('generale'),I=(id,f,v,t)=>`<input class="sexname ${S.players.find(x=>x.id==id)?.s=='F'?'F':'M'}" ${t||''} value="${esc(v)}" onchange="ed('${id}','${f}',this.value)">`,Sel=(id,v)=>`<select onchange="ed('${id}','s',this.value)"><option value="M" ${v=='M'?'selected':''}>M</option><option value="F" ${v=='F'?'selected':''}>F</option></select>`;
  return `<div class="section-hero"><div><div class="eyebrow">PADEL LEON / STAGIONE</div><h2>Classifica Generale</h2><p>Punti, presenze e medie di tutti i giocatori</p></div><div class="sport-metrics"><div class="hero-metric">${P.length}<small>ATLETI</small></div><div class="hero-metric">${P.reduce((a,p)=>a+(Number(p.vinti)||0),0)}<small>TORNEI VINTI</small></div></div></div><div class="card generale-card"><table><tr><th>#</th>${th('generale','Nome','n')}${th('generale','Cognome','c')}${th('generale','Sesso','s')}${th('generale','Punti','tot','n')}${th('generale','Tornei','t','n')}${th('generale','Media','med','n')}${th('generale','🏆 Vinti','vinti','n')}${th('generale','🥄 Ultimo','ultimo','n')}<th></th></tr>${P.map((p,i)=>`<tr class="person-row gender-${p.s==='F'?'F':'M'}"><td><span class="rank-no">${i+1}</span></td><td>${I(p.id,'n',p.n)}</td><td>${I(p.id,'c',p.c)}</td><td>${Sel(p.id,p.s||'M')}</td><td>${I(p.id,'tot',p.tot,'type="number" min="0"')}</td><td>${I(p.id,'t',p.t,'type="number" min="0"')}</td><td class="n"><b>${med(p).toFixed(2)}</b></td><td class="n">${I(p.id,'vinti',p.vinti||0,'type="number" min="0" title="Tornei vinti"')}</td><td class="n">${I(p.id,'ultimo',p.ultimo||0,'type="number" min="0" title="Ultimi posti"')}</td><td class="adm"><button class="x" aria-label="Elimina" onclick="del('${p.id}')">✕</button></td></tr>`).join('')}</table></div>
<div class="card adm"><div class="row"><input id="nn" placeholder="Nome" style="flex:1"><input id="nc" placeholder="Cognome" style="flex:1"><select id="ns" style="width:auto"><option value="M">M</option><option value="F">F</option></select><button class="p" onclick="add()">Aggiungi</button></div><p class="mut">Media = punti totali ÷ tornei giocati. 🏆 Vinti e 🥄 Ultimo aumentano soltanto alla conferma ADMIN. I valori sono modificabili dall'ADMIN per eventuali correzioni.</p><button class="s" onclick="if(confirm('Eliminare tutti i giocatori e il torneo corrente? Lo Storico resterà salvato.')){S={players:[],sel:{},T:null,mode:4};save();R()}">Svuota tutto</button></div>`}

function ed(id,f,v){const p=S.players.find(x=>x.id==id);p[f]=(f=='n'||f=='c'||f=='s')?v.trim():Math.max(0,+v||0);save();R()}
function del(id){S.players=S.players.filter(x=>x.id!=id);delete S.sel[id];save();R()}
function add(){const n=nn.value.trim(),c=nc.value.trim(),s=ns.value;if(!n)return;S.players.push({id:'p'+Date.now().toString(36),n,c,s,tot:0,t:0,vinti:0,ultimo:0});save();R()}
function tg(id){if(S.sel[id])delete S.sel[id];else if(Object.keys(S.sel).length<cfg().players)S.sel[id]=1;save();R();if(Object.keys(S.sel).length===cfg().players)window.scrollTo({top:0,behavior:'smooth'})}
function selTop(){S.sel={};[...S.players].sort((a,b)=>med(b)-med(a)).slice(0,cfg().players).forEach(p=>S.sel[p.id]=1);save();R();if(Object.keys(S.sel).length===cfg().players)window.scrollTo({top:0,behavior:'smooth'})}
function start(){
  if(S.T&&!confirm('Il torneo in corso verrà azzerato. Continuare?'))return;
  const C=cfg(),g=split(),names={},grp={};g.A.forEach(id=>grp[id]='A');g.B.forEach(id=>grp[id]='B');
  S.players.forEach(p=>{if(grp[p.id])names[p.id]=p.n+' '+(p.c||'').charAt(0)+'.'});
  S.T={uid:'torneo-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,11),startedAt:new Date().toISOString(),mode:C.mode,scheduleVersion:2,players:C.players,names,grp,applied:false,review:null,rounds:makeSchedule(g.A,g.B,C.mode)};
  save();go('turni');
}
function sc(i,k,f,v){
  if(!S.T||!AUTH)return;
  const T=S.T;
  if(T.mode===8&&(legacyEight(T)||i!==T.rounds.length-1||T.applied))return;
  const m=T.rounds[i].matches[k];
  m[f]=v===''?'':Math.max(0,Math.floor(Number(v)||0));
  if(T.mode===8)delete m.advance;
  if(!T.applied){T.review=isComplete(T)?'pending':null}
  save();
  if(isComplete(T)&&!T.applied){go('live');return}
  R();
}
function updateRows(){
  const ranked=table();
  return ranked.map((x,i)=>{
    const p=S.players.find(q=>q.id==x.id);
    return {id:x.id,name:p?.n||'',surname:p?.c||'',sex:p?.s||'M',oldTot:p?.tot||0,oldT:p?.t||0,addPt:x.pt,addT:1,addWin:i===0?1:0,addLast:i===ranked.length-1?1:0,newTot:(p?.tot||0)+x.pt,newT:(p?.t||0)+1,newMed:((p?.t||0)+1)?((p?.tot||0)+x.pt)/((p?.t||0)+1):0};
  });
}
function aggiorna(){
  const T=S.T;
  if(!T)return none();
  if(!isComplete(T))return `<div class="card"><h2>Aggiornamento classifica generale</h2><p>Prima devono essere completati tutti i risultati del torneo.</p></div>`;
  if(T.applied)return `<div class="card"><h2>Classifica Generale già aggiornata</h2><p>Questo torneo è già stato contabilizzato.</p></div>`;
  if(T.review==='rejected')return `<div class="card"><h2>Aggiornamento classifica rifiutato</h2><p>La proposta non è stata applicata. È possibile riproporla dalla Classifica live.</p><button class="p" onclick="proponiAggiornamento()">Riproporre aggiornamento</button></div>`;
  const rows=updateRows();
  return `<div class="card"><h2>Aggiorna classifica generale</h2><p>Questa è un'anteprima delle modifiche che verranno applicate. La conferma registrerà anche lo Storico completo del torneo, con data, classifica e turni. I valori con <b>+</b> indicano ciò che verrà aggiunto alla classifica.</p><div class="previewbox"><table><tr><th>Giocatore</th><th class="n">Punti attuali</th><th class="n">Variazione</th><th class="n">Tornei attuali</th><th class="n">Nuovi tornei</th><th class="n">Nuova media</th><th class="n">🏆 Vinti</th><th class="n">🥄 Ultimo</th></tr>${rows.map(r=>`<tr><td><span class="sexname ${r.sex=='F'?'F':'M'}">${esc(r.name)} ${esc(r.surname)}</span></td><td class="n">${r.oldTot}</td><td class="n"><b class="updateplus">+${r.addPt}</b></td><td class="n">${r.oldT}</td><td class="n"><b class="updateplus">+${r.addT}</b></td><td class="n"><b>${r.newMed.toFixed(2)}</b></td><td class="n">${r.addWin?'<b class="highlight-win">+1</b>':'—'}</td><td class="n">${r.addLast?'<b class="highlight-last">+1</b>':'—'}</td></tr>`).join('')}</table></div>${ADMIN?`<div class="row"><button class="p" onclick="confirmUpdate()">Conferma e aggiorna classifica</button><button class="s" onclick="rejectUpdate()">Rifiuta proposta</button></div>`:`<p class="mut">Proposta pronta. Solo l'Admin può confermare e applicare queste modifiche.</p>`}</div>`;
}
function rejectUpdate(){
  if(!ADMIN || !S.T || S.T.applied)return;
  if(!confirm('Rifiutare la proposta di aggiornamento della Classifica Generale?'))return;
  S.T.review='rejected';
  save();
  go('live');
}
function proponiAggiornamento(){
  if(!S.T || S.T.applied)return;
  S.T.review='pending';
  save();
  go('aggiorna');
}
async function confirmUpdate(){
  if(!ADMIN||!S.T||S.T.applied||approving)return;
  if(!isComplete(S.T)){alert('Completare il torneo prima della conferma.');return;}
  const T=S.T,rank=table();
  if(!confirm("Confermare la classifica per tutti i "+rank.length+" giocatori e archiviare il torneo nello Storico?"))return;
  approving=true;
  try{
    // Non lasciare che un vecchio salvataggio sovrascriva la conferma appena eseguita.
    clearTimeout(timer);
    await q;
    // Forza il salvataggio dell'ultimo risultato, anche se il debounce non è scaduto.
    const {error:saveError}=await sb.rpc('salva_stato_auth',{p_data:JSON.parse(JSON.stringify(S))});
    if(saveError)throw saveError;
    setSt('Conferma e archiviazione…');
    const classifica=rank.map((x,i)=>{
      const p=S.players.find(y=>y.id===x.id);
      return {...x,pos:i+1,n:p?.n||'',c:p?.c||'',s:p?.s||'M',fullName:(p?.n||'')+' '+(p?.c||''),diff:x.pf-x.ps};
    });
    const {data,error}=await sb.rpc('approva_torneo_padel',{p_torneo_id:T.uid||'',p_classifica:classifica});
    if(error)throw error;
    S=norm(data);
    await fetchHistory();
    setSt('Torneo approvato e archiviato');
    go('storico');
  }catch(e){
    setSt('Errore conferma: '+(e.message||String(e)),true);
    alert('Impossibile confermare o archiviare il torneo. '+(e.message||String(e))+'\nVerifichi di aver eseguito lo script SQL della versione 9 nel nuovo Supabase.');
    await fetchState();
    R();
  }finally{approving=false;}
}
function historyDate(iso){
  const d=new Date(iso);return Number.isNaN(d.getTime())?'Data non disponibile':d.toLocaleString('it-IT',{dateStyle:'medium',timeStyle:'short'});
}
function historicalTeam(T,team){
  return `<div class="hist-team">${team.map(id=>{
    const p=(T.ranking||[]).find(r=>String(r.id)===String(id));
    const cl=p?.s==='F'?'F':'M';
    const label=p?.fullName||T.names?.[id]||'Giocatore';
    return `<div class="sexname ${cl}">${esc(label)}</div>`;
  }).join('')}</div>`;
}
function storico(){
  if(HISTORY_ERROR)return `<div class="card"><h2>Storico non disponibile</h2><p>Non è possibile leggere l'archivio: ${esc(HISTORY_ERROR)}</p><p class="mut">Eseguire prima la migrazione SQL V9 nel nuovo Supabase.</p></div>`;
  if(!HISTORY.length)return `<div class="card"><h2>Storico tornei</h2><p class="mut">Nessun torneo ancora archiviato. Un torneo compare qui dopo che l'ADMIN conferma l'aggiornamento della Classifica Generale.</p></div>`;
  return `<h2 style="margin-top:0">Storico tornei · ${HISTORY.length}</h2><p class="mut">I tornei sono archiviati in modo permanente al momento dell'approvazione ADMIN. Lo storico non viene cancellato azzerando il torneo corrente.</p>`+
  HISTORY.map((h,i)=>{
    const t=h.snapshot||{},rank=Array.isArray(t.ranking)?t.ranking:[],rounds=Array.isArray(t.rounds)?t.rounds:[],winner=rank[0],last=rank[rank.length-1];
    const date=t.startedAt||h.approved_at;
    const playedCount=rounds.reduce((a,r)=>a+(r.matches?.length||0),0);
    const summary=`<div class="hist-summary"><div class="spotlight-grid">${spotlightCard('winner',winner?.fullName||winner?.name||'—',winner?.s,(Number(winner?.pt)||0)+' punti · Diff '+(Number(winner?.diff)||0),1,'Vincitore')}${spotlightCard('last',last?.fullName||last?.name||'—',last?.s,(Number(last?.pt)||0)+' punti · Diff '+(Number(last?.diff)||0),rank.length,'Ultimo classificato')}</div><p class="hist-date">Data torneo: ${historyDate(date)} · Confermato: ${historyDate(h.approved_at)}</p><p class="mut">${esc(String(h.mode))} giocatori · ${rounds.length} turni · ${playedCount} partite</p></div>`;
    const ranking=`<h3>Classifica finale</h3><div class="rank-scroll"><table class="rank-table"><thead><tr><th>#</th><th>Giocatore</th><th class="n">Pt</th><th class="n">G</th><th class="n">V</th><th class="n">N</th><th class="n">P</th><th class="n">Diff</th></tr></thead><tbody>${rank.map((r,k)=>`<tr class="${k===0?'rank-leader':k===rank.length-1?'rank-last':''}"><td><span class="rank-no">${k+1}</span></td><td class="sexname ${r.s==='F'?'F':'M'}">${esc(r.fullName||r.name||'—')}</td><td class="n rank-points">${Number(r.pt)||0}</td><td class="n">${Number(r.g)||0}</td><td class="n">${Number(r.w)||0}</td><td class="n">${Number(r.d)||0}</td><td class="n">${Number(r.l)||0}</td><td class="n">${Number(r.diff)||0}</td></tr>`).join('')}</tbody></table></div>`;
    const turns=`<h3>Turni e risultati</h3>${rounds.map((r,j)=>`<div class="hist-round"><b>Turno ${j+1}</b>${Array.isArray(r.rest)&&r.rest.length?`<p class="mut">A riposo: ${r.rest.map(id=>esc(rank.find(p=>String(p.id)===String(id))?.fullName||t.names?.[id]||'—')).join(', ')}</p>`:''}${(r.matches||[]).map((m,k)=>`<div class="mut">Campo ${k+1}</div><div class="hist-match">${historicalTeam(t,m.t1||[])}<span class="vs">${esc(String(m.s1))} – ${esc(String(m.s2))}</span>${historicalTeam(t,m.t2||[])}</div>`).join('')}</div>`).join('')}`;
    return `<details class="card hist-item" ${i===0?'open':''}><summary><span class="hist-archive-title">${historyDate(date)} · ${Number(h.mode)||'?'} giocatori</span></summary>${summary}${ranking}${turns}</details>`;
  }).join('');
}
function applyG(){go('aggiorna')}
init();
</script></body></html>
