const SUPABASE_URL='https://aelwovphlzesshsvflst.supabase.co',SUPABASE_KEY='sb_publishable_OwMYzJuBbxb0-WX8ub25_g_TKyaU5Sq';

let S={players:[],sel:{},T:null,mode:4},tab='live',ROLE='NONE',ADMIN=false,AUTH=null,timer,q=Promise.resolve();

const norm=d=>{d=d&&typeof d=='object'?d:{};const players=(d.players||[]).map(p=>{const oldG=Number.isFinite(+p.g)?+p.g:0;const t=Number.isFinite(+p.t)?+p.t:Math.floor(oldG/5);return{...p,t}});return{players,sel:d.sel||{},T:d.T||null,mode:[4,6,8].includes(Number(d.mode||d.T?.mode))?Number(d.mode||d.T?.mode):4}};

q=q.then(()=>sb.rpc('salva_stato_auth',{p_data:snap})).then(({error})=>setSt(error?'Errore di salvataggio: '+error.message:'Salvato',!!error)).catch(()=>setSt('Errore di rete',true))},350)}
async function fetchState(){const{data,error}=await sb.from('torneo_stato').select('data').eq('id',1).single();if(error){setSt('Errore di lettura: '+error.message,true);return false}S=norm(data.data);return true}

async function setAuth(user){

async function init(){

const med=p=>p.t?p.tot/p.t:0,done=m=>m.s1!==''&&m.s2!==''&&Number.isFinite(+m.s1)&&Number.isFinite(+m.s2);
const isComplete=T=>!!T&&!legacyEight(T)&&T.rounds?.length===cfg(T.mode).rounds&&T.rounds.every(r=>r.matches.every(done));
const sh=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const key=p=>[...p].sort().join('-');
const used=T=>{const s=new Set();T.rounds.forEach(r=>r.matches.forEach(m=>{s.add(key(m.t1));s.add(key(m.t2))}));return s};
function cfg(mode=S.T?.mode||S.mode){
  mode=Number(mode);
  return mode===6?{mode:6,players:6,group:3,matches:1,rounds:9}:mode===8?{mode:8,players:8,group:4,matches:2,rounds:6}:{mode:4,players:4,group:2,matches:1,rounds:6};
}
function setMode(m){
  if(S.T&&S.T.mode!==m){if(!confirm('Il torneo attuale verrà azzerato. Continuare?'))return;S.T=null;S.sel={}}
  S.mode=m;save();R();
}
function resetTournament(){
  if(!S.T||!confirm('Azzerare il torneo? I risultati non verranno aggiunti alla Classifica Generale.'))return;
  S.T=null;S.sel={};save();go('gruppi');
}
// I calendari sono creati tutti all'avvio: 6 partite a testa in ogni modalità.
// La ricerca privilegia partner diversi e avversari variati.
function makeSchedule(A,B,mode){
  const ids=[...A,...B],games=[];
  if(mode===4){
    const [a,b,c,d]=ids;
    const blocks=[[[a,b],[c,d]],[[a,c],[b,d]],[[a,d],[b,c]]];
    for(let i=0;i<6;i++){
      const t=blocks[i%3];games.push({A:ids,matches:[{t1:[...t[0]],t2:[...t[1]],s1:'',s2:''}]});
    }
    return games;
  }
  if(mode===8){
    // Come Beach Volley: si genera soltanto il primo turno.
    // I turni successivi dipendono dai risultati appena inseriti.
    return [makeRoundAB(A,B,[])];
  }
  // 6 giocatori: 9 partite, ciascuno gioca 6 volte e riposa 3.
  // Valutiamo numerosi calendari e minimizziamo squilibri e partner ripetuti.
  let best=null,bestScore=Infinity;
  for(let trial=0;trial<1800;trial++){
    const count=Object.fromEntries(ids.map(x=>[x,0]));
    const mates={},opps={},rests={},rounds=[];let penalty=0;
    for(let r=0;r<9;r++){
      const eligible=sh(ids).sort((x,y)=>count[x]-count[y]);
      const active=eligible.slice(0,4);
      const resting=ids.filter(x=>!active.includes(x));
      const restKey=key(resting);penalty+=(rests[restKey]||0)*12;rests[restKey]=(rests[restKey]||0)+1;
      for(const x of active)count[x]++;
      const variants=[[[0,1],[2,3]],[[0,2],[1,3]],[[0,3],[1,2]]];
      let bestVariant=null,local=Infinity;
      for(const v of variants){
        let sc=0;
        for(const pair of v){sc+=(mates[key(pair.map(i=>active[i]))]||0)*30}
        for(const x of v[0])for(const y of v[1])sc+=(opps[key([active[x],active[y]])]||0)*3;
        if(sc<local){local=sc;bestVariant=v}
      }
      penalty+=local;
      for(const pair of bestVariant){const k=key(pair.map(i=>active[i]));mates[k]=(mates[k]||0)+1}
      for(const x of bestVariant[0])for(const y of bestVariant[1]){const k=key([active[x],active[y]]);opps[k]=(opps[k]||0)+1}
      rounds.push({A:ids,matches:[{t1:bestVariant[0].map(i=>active[i]),t2:bestVariant[1].map(i=>active[i]),s1:'',s2:''}],rest:resting});
    }
    penalty+=ids.reduce((v,id)=>v+Math.abs(count[id]-6)*1000,0);
    if(penalty<bestScore){bestScore=penalty;best=rounds}
    if(bestScore<35)break;
  }
  return best;
}
// Genera coppie AB contro AB. Prima evita partner gia' incontrati;
// quando non e' possibile, minimizza le ripetizioni e gli avversari ricorrenti.
function makeRoundAB(A,B,previousRounds){
  if(A.length!==4||B.length!==4||new Set([...A,...B]).size!==8){
    throw Error('Per ogni turno servono 4 giocatori A e 4 B distinti.');
  }
  const partnerCount={},opponentCount={};
  for(const r of previousRounds){
    for(const m of r.matches){
      for(const tm of [m.t1,m.t2]){
        const k=key(tm);partnerCount[k]=(partnerCount[k]||0)+1;
      }
      for(const x of m.t1)for(const y of m.t2){
        const k=key([x,y]);opponentCount[k]=(opponentCount[k]||0)+1;
      }
    }
  }
  const sexes=Object.fromEntries(S.players.map(p=>[p.id,p.s||'M']));
  let best=null,bestScore=Infinity;
  // 24 permutazioni dei partner B, tre accoppiamenti fra quattro coppie.
  const perms=a=>a.length? a.flatMap((v,i)=>perms(a.filter((_,j)=>j!==i)).map(q=>[v,...q])):[[]];
  const layouts=[[[0,1],[2,3]],[[0,2],[1,3]],[[0,3],[1,2]]];
  for(const shuffledA of [A, [...A].reverse()]){
    for(const bs of perms(B)){
      const pairs=shuffledA.map((id,i)=>[id,bs[i]]);
      for(const layout of layouts){
        let score=0;
        for(const pair of pairs){
          const n=partnerCount[key(pair)]||0;
          score+=n*100+n*n*20;
        }
        for(const [i,j] of layout){
          const x=pairs[i],y=pairs[j];
          for(const a of x)for(const b of y){
            const n=opponentCount[key([a,b])]||0;
            score+=n*5;
          }
          const men=t=>t.filter(id=>sexes[id]==='M').length;
          const mx=men(x),my=men(y);
          if((mx===0&&my!==0)||(my===0&&mx!==0))score+=30;
          if((mx===0&&my===2)||(mx===2&&my===0))score+=30;
        }
        // Scelta casuale in caso di parita': mantiene una certa varieta'.
        score+=Math.random()*0.01;
        if(score<bestScore){bestScore=score;best=layout.map(([i,j])=>({t1:pairs[i],t2:pairs[j],s1:'',s2:''}));}
      }
    }
  }
  return {A:[...A],matches:best};
}
function legacyEight(T){return T?.mode===8 && T.scheduleVersion!==2;}
function roundReady(r){
  return r.matches.every(done);
}
// In caso di pareggio il sorteggio assegna una squadra al gruppo A
// e l'altra al gruppo B esclusivamente ai fini del turno successivo.
// Il risultato resta un pareggio e assegna 1 punto a ogni giocatore.
function nextRound(){
  const T=S.T;
  if(!AUTH||!T||T.mode!==8||legacyEight(T)||T.rounds.length>=6)return;
  const last=T.rounds[T.rounds.length-1];
  if(!roundReady(last)){alert('Inserisca entrambi i risultati prima di generare il turno successivo.');return;}
  const A=[],B=[];
  last.matches.forEach(m=>{
    if(+m.s1===+m.s2 && m.advance!==1 && m.advance!==2){
      m.advance=Math.random()<0.5?1:2;
    }
    const first=+m.s1>+m.s2 || (+m.s1===+m.s2 && m.advance===1);
    A.push(...(first?m.t1:m.t2));B.push(...(first?m.t2:m.t1));
  });
  try{
    T.rounds.push(makeRoundAB(A,B,T.rounds));
    T.review=null;save();R();
  }catch(e){setSt('Errore generazione turno: '+e.message,true);}
}
function table(){const T=S.T,t={};Object.keys(T.names).forEach(id=>t[id]={id,pt:0,g:0,w:0,d:0,l:0,pf:0,ps:0});
T.rounds.forEach(r=>r.matches.forEach(m=>{if(!done(m))return;const a=+m.s1,b=+m.s2;[[m.t1,a,b],[m.t2,b,a]].forEach(([tm,f,s])=>tm.forEach(id=>{const x=t[id];x.g++;x.pf+=f;x.ps+=s;if(f>s){x.pt+=3;x.w++}else if(f===s){x.pt++;x.d++}else x.l++}))}));
return Object.values(t).sort((a,b)=>b.pt-a.pt||(b.pf-b.ps)-(a.pf-a.ps)||b.pf-a.pf)}
function go(t){tab=t;R()}
function sortBy(view,key){
  const x=sorts[view]||{};
  if(x.key===key)x.dir*=-1;else{ x.key=key;x.dir=key==='n'||key==='c'||key==='s'?1:-1 }
  sorts[view]=x;R();
}
function cmpVal(a,b,key){
  let x,y;
  if(key==='med'){x=med(a);y=med(b)}
  else if(key==='g'){x=a.g||0;y=b.g||0}
  else if(key==='tot'){x=a.tot||0;y=b.tot||0}
  else if(key==='n'||key==='c'||key==='s'){x=(a[key]||'').toLocaleLowerCase('it');y=(b[key]||'').toLocaleLowerCase('it')}
  else{x=a[key]??0;y=b[key]??0}
  if(typeof x==='string')return x.localeCompare(y,'it',{sensitivity:'base'})
  return x-y;
}
function sortedPlayers(view){
  const o=sorts[view]||{key:'med',dir:-1};
  return [...S.players].sort((a,b)=>cmpVal(a,b,o.key)*o.dir || (a.id||'').localeCompare(b.id||''));
}
function th(view,label,key,cls=''){
  const o=sorts[view]||{}; const state=o.key===key?(o.dir===1?'up':'down'):'';
  return `<th class="${cls}"><button class="sortbtn ${state}" onclick="sortBy('${view}','${key}')">${label}</button></th>`;
}
function R(){
  document.getElementById('nav').innerHTML=[['live','Classifica live'],['turni','Turni'],['gruppi','Gruppi'],['generale','Classifica Generale']].map(([k,l])=>`<button class="${tab==k?'on':''}" onclick="go('${k}')">${l}</button>`).join('');
  document.getElementById('v').innerHTML=({live,turni,gruppi,generale,aggiorna})[tab]();
  document.getElementById('ab').textContent=AUTH?(ADMIN?'Esci':'Esci'):'Login';
  if(!AUTH){setSt('Login richiesto per modificare il torneo');document.querySelectorAll('#v input, #v select').forEach(i=>i.disabled=true);document.querySelectorAll('#v button:not(.sortbtn)').forEach(e=>{if(!e.closest('nav'))e.disabled=true});}
  else if(!ADMIN){setSt('Utente · torneo modificabile');document.querySelectorAll('#v .adm').forEach(e=>e.remove());document.querySelectorAll('#v input, #v select').forEach(i=>{if(tab==='generale')i.disabled=true});}
  else setSt('Admin · accesso completo');
}
const none=()=>`<div class="card"><h2>Nessun torneo in corso</h2><p>Scegli la modalità, seleziona i giocatori e avvia il torneo.</p><button class="p" onclick="go('gruppi')">Scegli i giocatori</button></div>`;
function live(){const T=S.T;if(!T)return none();const t=table(),C=cfg(T.mode),completed=isComplete(T);
return `<p class="mut">${T.rounds.flatMap(r=>r.matches).filter(done).length}/${T.rounds.flatMap(r=>r.matches).length} partite completate · ${C.rounds} turni</p><div class="card"><table><tr><th>#</th><th>Giocatore</th><th class="n">Pt</th><th class="n">G</th><th class="n">V</th><th class="n">N</th><th class="n">P</th><th class="n">Diff</th></tr>${t.map((x,i)=>`<tr class="${i?'':'lead'}"><td>${i+1}</td><td><i class="bd ${T.mode===8?(T.rounds.at(-1).A.includes(x.id)?'A':'B'):(T.grp[x.id]||'A')}">${T.mode===8?(T.rounds.at(-1).A.includes(x.id)?'A':'B'):(T.grp[x.id]||'A')}</i><span class="sexname ${S.players.find(p=>p.id==x.id)?.s=='F'?'F':'M'}">${esc(T.names[x.id])}</span></td><td class="n">${x.pt}</td><td class="n">${x.g}</td><td class="n">${x.w}</td><td class="n">${x.d}</td><td class="n">${x.l}</td><td class="n">${x.pf-x.ps}</td></tr>`).join('')}</table></div><p class="mut">Vittoria 3 punti · pareggio 1 · sconfitta 0. A parità: differenza punti, poi punti fatti.</p>${legacyEight(T)?'<p class="mut">Calendario precedente: apra Turni per aggiornarlo.</p>':''}${completed&&!T.applied?`<div class="row"><button class="p public" onclick="proponiAggiornamento()">Aggiorna classifica generale</button></div>`:completed&&T.applied?`<p class="mut">Classifica Generale già aggiornata con questo torneo.</p>`:''}`}
const team=(T,r,tm)=>`<div class="t">${tm.map(id=>{const g=T.mode===8?(r.A.includes(id)?'A':'B'):(T.grp[id]||'A');const p=S.players.find(x=>x.id==id);const sex=p?.s=='F'?'F':'M';return `<span><i class="bd ${g}">${g}</i><span class="sexname ${sex}">${esc(T.names[id])}</span></span>`}).join('')}</div>`;
function turni(){
  const T=S.T;if(!T)return none();const C=cfg(T.mode),n=T.rounds.length;
  if(legacyEight(T))return `<div class="card"><h2>Calendario da aggiornare</h2><p>Questo torneo usa il precedente calendario fisso: non prevede il passaggio dei vincitori nel gruppo A e degli sconfitti nel gruppo B.</p><p>Per utilizzare le nuove regole occorre iniziare un nuovo torneo. La Classifica Generale non verrà cancellata.</p><button class="p" onclick="resetTournament()">Azzera il vecchio torneo</button></div>`;
  const current=T.rounds[n-1],ready=roundReady(current);
  const nextBtn=T.mode===8 && n<6?`<div class="row"><button class="p" ${ready?'':'disabled'} onclick="nextRound()">Genera turno ${n+1}</button></div><p class="mut">I vincitori diventano gruppo A e gli sconfitti gruppo B. In caso di pareggio, i gruppi vengono assegnati casualmente. Il nuovo turno si genera dopo tutti i risultati.</p>`:'';
  // Visualizza sempre prima il turno corrente, mantenendo invariati gli indici originali
  // delle partite per il salvataggio dei risultati su Supabase.
  const order=[n-1,...Array.from({length:n-1},(_,j)=>n-2-j)];
  return `<p class="mut">Modalità: ${C.mode===8?'2 campi · 8 giocatori':`1 campo · ${C.players} giocatori`} · ${C.rounds} turni · 6 partite per giocatore</p>`+
  order.map(i=>{
    const r=T.rounds[i];
    return `${i===n-1?`<h2>Turno ${i+1} · ${roundReady(r)?'Completato':'In corso'}</h2>${nextBtn}`:`${i===n-2?'<h2 class="mut">Turni precedenti</h2>':''}<h3 class="mut">Turno ${i+1} · Concluso</h3>`}`+`${T.mode===8?`<p class="mut">Gruppo A: ${r.A.map(id=>esc(T.names[id])).join(', ')} · Gruppo B: ${Object.keys(T.names).filter(id=>!r.A.includes(id)).map(id=>esc(T.names[id])).join(', ')}</p>`:''}${r.rest?.length?`<p class="mut">A riposo: ${r.rest.map(id=>esc(T.names[id])).join(', ')}</p>`:''}`+
    r.matches.map((m,k)=>{
    const locked=T.mode===8 && (i<n-1 || T.applied);
    const isDraw=done(m)&&+m.s1===+m.s2;
    const tieNotice=T.mode===8 && isDraw && (m.advance===1||m.advance===2)
      ? `<p class="mut">Sorteggio per i gruppi: squadra ${m.advance} in A, squadra ${m.advance===1?2:1} in B.</p>`
      : T.mode===8 && isDraw && n<6
      ? `<p class="mut">I gruppi A e B saranno assegnati casualmente alla generazione del prossimo turno.</p>` : '';
    return `<div class="card"><div class="mut">Campo ${k+1}</div><div class="m">${team(T,r,m.t1)}<div class="sc"><input type="number" min="0" inputmode="numeric" value="${m.s1}" ${locked?'disabled':''} aria-label="Punti squadra 1" onchange="sc(${i},${k},'s1',this.value)">–<input type="number" min="0" inputmode="numeric" value="${m.s2}" ${locked?'disabled':''} aria-label="Punti squadra 2" onchange="sc(${i},${k},'s2',this.value)"></div>${team(T,r,m.t2)}</div>${done(m)?`<p class="mut">${isDraw?'Pareggio: 1 punto a tutti':+m.s1>+m.s2?'Vittoria squadra 1':'Vittoria squadra 2'}</p>`:''}${tieNotice}</div>`;
    }).join('');
  }).join('');
}
const split=()=>{const C=cfg(),ids=S.players.filter(p=>S.sel[p.id]).sort((a,b)=>med(b)-med(a)).map(p=>p.id);return{A:ids.slice(0,C.group),B:ids.slice(C.group,C.players)}};
function gruppi(){
  const C=cfg(),P=sortedPlayers('gruppi'),n=P.filter(p=>S.sel[p.id]).length,ok=n===C.players,g=ok?split():null;
  const col=(L,ids)=>`<div style="min-width:0"><div style="margin-bottom:8px"><i class="bd ${L}">${L}</i><b>Gruppo ${L}</b></div><table><tr><th>Nome</th><th>Cognome</th><th class="n">Tornei</th><th class="n">Media</th></tr>${ids.map(id=>{const p=S.players.find(x=>x.id==id);return `<tr><td><span class="sexname ${p.s=='F'?'F':'M'}">${esc(p.n)}</span></td><td>${esc(p.c)}</td><td class="n">${p.t||0}</td><td class="n">${med(p).toFixed(2)}</td></tr>`}).join('')}</table></div>`;
  return `${ok?`<div class="card" id="riepilogo-gruppi"><h2 style="margin-top:0">Riepilogo gruppi · ${C.players} giocatori</h2><div class="m" style="align-items:start">${col('A',g.A)}<span></span>${col('B',g.B)}</div><div class="row"><button class="p" onclick="start()">Avvia torneo</button></div></div>`:''}<div class="card"><h2>Modalità torneo</h2><div class="row"><button class="${C.mode===4?'p':'s'}" onclick="setMode(4)">1 campo · 4 giocatori</button><button class="${C.mode===6?'p':'s'}" onclick="setMode(6)">1 campo · 6 giocatori</button><button class="${C.mode===8?'p':'s'}" onclick="setMode(8)">2 campi · 8 giocatori</button>${S.T?'<button class="s" onclick="resetTournament()">Azzera torneo</button>':''}</div><p class="mut">Ogni partecipante giocherà 6 partite. ${C.mode===8?'Squadre sempre AB contro AB.':C.mode===6?'Due giocatori a riposo per turno.':'Ogni coppia di compagni si ripete due volte.'}</p></div>
  <div class="card"><p>Selezioni ${C.players} giocatori dalla Classifica Generale. ${C.mode===8?'Al primo turno i 4 giocatori con media più alta formeranno il gruppo A e gli altri 4 il gruppo B. Dopo ogni turno chi vince passa nel gruppo A e chi perde nel gruppo B.':'I gruppi A e B sono indicativi e servono per visualizzare i partecipanti.'}</p><p><b>${n}/${C.players} selezionati</b></p><div class="row"><button class="s" onclick="selTop()">Seleziona i primi ${C.players}</button><button class="s" onclick="S.sel={};save();R()">Azzera selezione</button></div>${P.length<C.players?`<p class="mut">Servono almeno ${C.players} giocatori nella Classifica Generale.</p>`:''}<table><tr><th></th>${th('gruppi','Nome','n')}${th('gruppi','Cognome','c')}${th('gruppi','Sesso','s')}${th('gruppi','Tornei','t','n')}${th('gruppi','Media','med','n')}</tr>${P.map(p=>`<tr><td><input type="checkbox" style="width:22px;height:22px;min-width:0" aria-label="Seleziona ${esc(p.n)} ${esc(p.c)}" ${S.sel[p.id]?'checked':''} ${!S.sel[p.id]&&n>=C.players?'disabled':''} onchange="tg('${p.id}')"></td><td><span class="sexname ${p.s=='F'?'F':'M'}">${esc(p.n)}</span></td><td>${esc(p.c)}</td><td>${p.s||'M'}</td><td class="n">${p.t||0}</td><td class="n">${med(p).toFixed(2)}</td></tr>`).join('')}</table></div>
  `;
}
function generale(){
  const P=sortedPlayers('generale'),I=(id,f,v,t)=>`<input class="sexname ${S.players.find(x=>x.id==id)?.s=='F'?'F':'M'}" ${t||''} value="${esc(v)}" onchange="ed('${id}','${f}',this.value)">`,Sel=(id,v)=>`<select onchange="ed('${id}','s',this.value)"><option value="M" ${v=='M'?'selected':''}>M</option><option value="F" ${v=='F'?'selected':''}>F</option></select>`;
  return `<div class="card"><table><tr><th>#</th>${th('generale','Nome','n')}${th('generale','Cognome','c')}${th('generale','Sesso','s')}${th('generale','Punti','tot','n')}${th('generale','Tornei','t','n')}${th('generale','Media','med','n')}<th></th></tr>${P.map((p,i)=>`<tr><td>${i+1}</td><td>${I(p.id,'n',p.n)}</td><td>${I(p.id,'c',p.c)}</td><td>${Sel(p.id,p.s||'M')}</td><td>${I(p.id,'tot',p.tot,'type="number" min="0"')}</td><td>${I(p.id,'t',p.t,'type="number" min="0"')}</td><td class="n"><b>${med(p).toFixed(2)}</b></td><td class="adm"><button class="x" aria-label="Elimina" onclick="del('${p.id}')">✕</button></td></tr>`).join('')}</table></div>
<div class="card adm"><div class="row"><input id="nn" placeholder="Nome" style="flex:1"><input id="nc" placeholder="Cognome" style="flex:1"><select id="ns" style="width:auto"><option value="M">M</option><option value="F">F</option></select><button class="p" onclick="add()">Aggiungi</button></div><p class="mut">Media = punti totali ÷ tornei giocati.</p><button class="s" onclick="if(confirm('Eliminare tutti i giocatori e il torneo?')){S={players:[],sel:{},T:null,mode:4};save();R()}">Svuota tutto</button></div>`}

function ed(id,f,v){const p=S.players.find(x=>x.id==id);p[f]=(f=='n'||f=='c'||f=='s')?v.trim():Math.max(0,+v||0);save();R()}
function del(id){S.players=S.players.filter(x=>x.id!=id);delete S.sel[id];save();R()}
function add(){const n=nn.value.trim(),c=nc.value.trim(),s=ns.value;if(!n)return;S.players.push({id:'p'+Date.now().toString(36),n,c,s,tot:0,t:0});save();R()}
function tg(id){if(S.sel[id])delete S.sel[id];else if(Object.keys(S.sel).length<cfg().players)S.sel[id]=1;save();R();if(Object.keys(S.sel).length===cfg().players)window.scrollTo({top:0,behavior:'smooth'})}
function selTop(){S.sel={};[...S.players].sort((a,b)=>med(b)-med(a)).slice(0,cfg().players).forEach(p=>S.sel[p.id]=1);save();R();if(Object.keys(S.sel).length===cfg().players)window.scrollTo({top:0,behavior:'smooth'})}
function start(){
  if(S.T&&!confirm('Il torneo in corso verrà azzerato. Continuare?'))return;
  const C=cfg(),g=split(),names={},grp={};g.A.forEach(id=>grp[id]='A');g.B.forEach(id=>grp[id]='B');
  S.players.forEach(p=>{if(grp[p.id])names[p.id]=p.n+' '+(p.c||'').charAt(0)+'.'});
  S.T={mode:C.mode,scheduleVersion:2,players:C.players,names,grp,applied:false,review:null,rounds:makeSchedule(g.A,g.B,C.mode)};
  save();go('turni');
}
function sc(i,k,f,v){
  if(!S.T||!AUTH)return;
  const T=S.T;
  if(T.mode===8&&(legacyEight(T)||i!==T.rounds.length-1||T.applied))return;
  const m=T.rounds[i].matches[k];
  m[f]=v===''?'':Math.max(0,Math.floor(Number(v)||0));
  if(T.mode===8)delete m.advance;
  if(!T.applied){T.review=isComplete(T)?'pending':null}
  save();
  if(isComplete(T)&&!T.applied){go('live');return}
  R();
}
function updateRows(){
  return table().map(x=>{
    const p=S.players.find(q=>q.id==x.id);
    return {id:x.id,name:p?.n||'',surname:p?.c||'',sex:p?.s||'M',oldTot:p?.tot||0,oldT:p?.t||0,addPt:x.pt,addT:1,newTot:(p?.tot||0)+x.pt,newT:(p?.t||0)+1,newMed:((p?.t||0)+1)?((p?.tot||0)+x.pt)/((p?.t||0)+1):0};
  });
}
function aggiorna(){
  const T=S.T;
  if(!T)return none();
  if(!isComplete(T))return `<div class="card"><h2>Aggiornamento classifica generale</h2><p>Prima devono essere completati tutti i risultati del torneo.</p></div>`;
  if(T.applied)return `<div class="card"><h2>Classifica Generale già aggiornata</h2><p>Questo torneo è già stato contabilizzato.</p></div>`;
  if(T.review==='rejected')return `<div class="card"><h2>Aggiornamento classifica rifiutato</h2><p>La proposta non è stata applicata. È possibile riproporla dalla Classifica live.</p><button class="p" onclick="proponiAggiornamento()">Riproporre aggiornamento</button></div>`;
  const rows=updateRows();
  return `<div class="card"><h2>Aggiorna classifica generale</h2><p>Questa è un'anteprima delle modifiche che verranno applicate. I valori con <b>+</b> indicano ciò che verrà aggiunto alla classifica.</p><div class="previewbox"><table><tr><th>Giocatore</th><th class="n">Punti attuali</th><th class="n">Variazione</th><th class="n">Tornei attuali</th><th class="n">Nuovi tornei</th><th class="n">Nuova media</th></tr>${rows.map(r=>`<tr><td><span class="sexname ${r.sex=='F'?'F':'M'}">${esc(r.name)} ${esc(r.surname)}</span></td><td class="n">${r.oldTot}</td><td class="n"><b class="updateplus">+${r.addPt}</b></td><td class="n">${r.oldT}</td><td class="n"><b class="updateplus">+${r.addT}</b></td><td class="n"><b>${r.newMed.toFixed(2)}</b></td></tr>`).join('')}</table></div>${ADMIN?`<div class="row"><button class="p" onclick="confirmUpdate()">Conferma e aggiorna classifica</button><button class="s" onclick="rejectUpdate()">Rifiuta proposta</button></div>`:`<p class="mut">Proposta pronta. Solo l'Admin può confermare e applicare queste modifiche.</p>`}</div>`;
}
function rejectUpdate(){
  if(!ADMIN || !S.T || S.T.applied)return;
  if(!confirm('Rifiutare la proposta di aggiornamento della Classifica Generale?'))return;
  S.T.review='rejected';
  save();
  go('live');
}
function proponiAggiornamento(){
  if(!S.T || S.T.applied)return;
  S.T.review='pending';
  save();
  go('aggiorna');
}
function confirmUpdate(){
  if(!ADMIN || !S.T || S.T.applied)return;
  const rows=updateRows();
  if(!confirm("Confermare l'aggiornamento della Classifica Generale per tutti i "+rows.length+" giocatori?"))return;
  rows.forEach(r=>{const p=S.players.find(q=>q.id==r.id);if(p){p.tot=r.newTot;p.t=r.newT}});
  S.T.applied=true;
  S.T.review='approved';
  save();
  go('generale');
}
function applyG(){go('aggiorna')}
init();
</script></body></html>
